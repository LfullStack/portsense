{% extends "base.html" %}
{% block title %}Iniciar Sesion{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="PortuSense Logo"
                         style="max-width: 160px; height: auto;" class="mb-2">
                    <p class="text-muted">Sistema de Gestion Portuaria</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario:</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Tu usuario" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Tu contrasena" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesion
                    </button>
                </form>
                <div class="text-center">
                    <a href="{{ url_for('register') }}" class="text-decoration-none">
                        No tienes cuenta? Registrate aqui
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
