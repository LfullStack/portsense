{% extends "base.html" %}
{% block title %}Registro{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-success" style="font-size: 3rem;"></i>
                    <h2>Crear Cuenta</h2>
                    <p class="text-muted">Registrate en PortuSense</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Elige un usuario" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contrasena</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Elige una contrasena" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield"></i></span>
                            <select name="role" class="form-select">
                                <option value="operator">Operador</option>
                                <option value="supervisor">Supervisor</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">
                        <i class="bi bi-check-circle"></i> Crear Cuenta
                    </button>
                </form>
                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">
                        Ya tienes cuenta? Inicia sesion
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
